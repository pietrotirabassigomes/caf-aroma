<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./CSS/style.css">

    <title>Café</title>
</head>

<body>

    <header>

        <div class="logo">
            <img src="./img/logo.png" alt="Logo Café">
            <h2>Café Aroma</h2>
        </div>

        <nav>
            <a href="">Início</a>
            <a href="">Cardápio</a>
            <a href="">Contato</a>
        </nav>

    </header>

    <section class="banner">

        <div class="texto-banner">

            <h1>O melhor café da cidade</h1>

            <p>
                Descubra sabores únicos preparados com grãos selecionados
                e um ambiente acolhedor para você aproveitar cada momento.
            </p>

            <button>Conheça nosso Cardápio</button>

        </div>

        <img src="./img/banner.jpg" alt="Xícara de café">

    </section>

</html>
